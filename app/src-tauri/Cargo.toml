[package]
name = "Kalaido"
version = "0.0.4"
description = "Kalaido"
authors = ["North Shore Software Ltd. <kalaido@northshoresoftware.ca>"]
edition = "2024"
license = "AGPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kalaido_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api enables wry/transparent, which disables WKWebView's
# `drawsBackground` (a private KVC key) so the window's own colour shows through
# before the document paints.
#
# NOT STRICTLY NECESSARY. `theme: "Dark"` in tauri.conf.json already removes the
# white; without this feature the pre-paint region is WebKit's dark-appearance
# default, a near-black that reads slightly off against our #252628 canvas. This
# closes that last gap — it is polish, not a fix.
#
# REMOVE THIS FOR MAC APP STORE DISTRIBUTION. Private API use is checked at App
# Store review; Developer ID notarization (how this app ships) does not audit it,
# so there is no penalty today. Dropping it costs a slightly-off dark, nothing
# more. See DESIGN.md §3.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tauri-plugin-dialog = "2.7.1"
rand = "0.9"
zip = "2"

