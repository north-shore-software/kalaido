name: pr

on:
  pull_request:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      go: ${{ steps.filter.outputs.go }}
      schema: ${{ steps.filter.outputs.schema }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ts:
              - 'packages/**'
              - 'apps/web/**'
              - 'apps/desktop/src/**'
              - 'apps/desktop/public/**'
              - 'apps/desktop/*.{ts,tsx,js,mjs,cjs,json,html,css}'
              - 'apps/mobile/src/**'
              - 'apps/mobile/public/**'
              - 'apps/mobile/*.{ts,tsx,js,mjs,cjs,json,html,css}'
              - 'scripts/**'
              - '*.json'
              - '*.ts'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'kalaido.sh'
              - '.github/workflows/pr.yml'
            go:
              - 'kalaidoscope/**'
              - 'kalaido.sh'
              - '.github/workflows/pr.yml'
            schema:
              - 'kalaidoscope/**'
              - 'packages/lib/client/src/kalaidoscope/types.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'kalaido.sh'
              - '.github/workflows/pr.yml'
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'apps/desktop/src-tauri/**'
              - 'apps/mobile/src-tauri/**'
              - 'kalaido.sh'
              - '.github/workflows/pr.yml'

  ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: ./kalaido.sh setup:ts
      - run: ./kalaido.sh check:ts
      - run: ./kalaido.sh test:ts

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: kalaidoscope/go.mod
          cache-dependency-path: kalaidoscope/go.sum
      - run: ./kalaido.sh setup:go
      - run: ./kalaido.sh check:go
      - run: ./kalaido.sh test:go
      - run: ./kalaido.sh build:sidecar

  schema:
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: kalaidoscope/go.mod
          cache-dependency-path: kalaidoscope/go.sum
      - run: ./kalaido.sh setup:ts
      - run: ./kalaido.sh setup:go
      - run: ./kalaido.sh check:schema-freshness

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: kalaidoscope/go.mod
          cache-dependency-path: kalaidoscope/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: ./kalaido.sh setup:go
      - run: ./kalaido.sh setup:rust
      - run: ./kalaido.sh build:sidecar
      - run: ./kalaido.sh check:rust
      - run: ./kalaido.sh test:rust
