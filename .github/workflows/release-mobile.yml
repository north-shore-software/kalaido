name: release mobile

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - name: bump to release version and tag
        id: release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./kalaido.sh bump release
          version="$(awk -F'"' '/^  "version": / { print $4; exit }' apps/mobile/src-tauri/tauri.conf.json)"
          tag="android-v$version"
          git add \
            apps/desktop/src-tauri/tauri.conf.json \
            apps/desktop/package.json \
            apps/desktop/src-tauri/Cargo.toml \
            apps/mobile/src-tauri/tauri.conf.json \
            apps/mobile/package.json \
            apps/mobile/src-tauri/Cargo.toml \
            Cargo.lock
          git commit -m "release $tag"
          git tag "$tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: bump to next dev version and push
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          ./kalaido.sh bump dev
          version="$(awk -F'"' '/^  "version": / { print $4; exit }' apps/mobile/src-tauri/tauri.conf.json)"
          git add \
            apps/desktop/src-tauri/tauri.conf.json \
            apps/desktop/package.json \
            apps/desktop/src-tauri/Cargo.toml \
            apps/mobile/src-tauri/tauri.conf.json \
            apps/mobile/package.json \
            apps/mobile/src-tauri/Cargo.toml \
            Cargo.lock
          git commit -m "bump to $version"
          git push --atomic origin HEAD:main "$TAG"

  android:
    runs-on: ubuntu-latest
    needs: bump
    environment: release
    env:
      VITE_BETTER_AUTH_URL: https://auth.kalaido.co
      VITE_CLOUD_PB_URL: https://s.kalaido.co
      VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN }}
      VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}
      VITE_PUBLIC_POSTHOG_FEEDBACK_SURVEY_ID: ${{ vars.VITE_PUBLIC_POSTHOG_FEEDBACK_SURVEY_ID }}
      VITE_PUBLIC_POSTHOG_FEEDBACK_QUESTION_ID: ${{ vars.VITE_PUBLIC_POSTHOG_FEEDBACK_QUESTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.bump.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: setup android sdk and ndk
        run: |
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          bt_pkg="$("$sdkmanager" --list 2>/dev/null | tr '\r' '\n' | awk -F'|' '{ gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); if ($1 ~ /^build-tools;[0-9]+\.[0-9]+\.[0-9]+$/) print $1 }' | sort -V | tail -n 1)"
          "$sdkmanager" "platform-tools" "platforms;android-37" "$bt_pkg"
          if [[ -z "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]]; then
            ndk_pkg="$("$sdkmanager" --list 2>/dev/null | tr '\r' '\n' | awk -F'|' '{ gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); if ($1 ~ /^ndk;[0-9]+\.[0-9]+\.[0-9]+$/) print $1 }' | sort -V | tail -n 1)"
            "$sdkmanager" "$ndk_pkg"
          fi
          ndk_dir="$ANDROID_HOME/ndk/$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -n 1)"
          bt_dir="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$bt_dir" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - run: ./kalaido.sh setup:ts
      - run: ./kalaido.sh init:android
      - run: ./kalaido.sh build:android:release

      - name: sign and verify apk
        env:
          VERSION: ${{ needs.bump.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          unsigned_apk="apps/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          aligned_apk="$RUNNER_TEMP/app-aligned.apk"
          signed_apk="$RUNNER_TEMP/kalaido_android_v${VERSION}.apk"
          keystore="$RUNNER_TEMP/upload-keystore.jks"

          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || { echo "missing ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || { echo "missing ANDROID_KEYSTORE_PASSWORD" >&2; exit 1; }
          [[ -n "$ANDROID_KEY_ALIAS" ]] || { echo "missing ANDROID_KEY_ALIAS" >&2; exit 1; }
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || { echo "missing ANDROID_KEY_PASSWORD" >&2; exit 1; }

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore"
          chmod 600 "$keystore"

          zipalign -P 16 -f 4 "$unsigned_apk" "$aligned_apk"
          apksigner sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$signed_apk" \
            "$aligned_apk"
          apksigner verify --verbose "$signed_apk"
          rm -f "$keystore" "$aligned_apk"

      - name: create draft prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.bump.outputs.tag }}
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          gh release create "$TAG" \
            "$RUNNER_TEMP/kalaido_android_v${VERSION}.apk" \
            --repo "${{ github.repository }}" \
            --title "Kalaido Mobile $TAG" \
            --notes "" \
            --verify-tag \
            --draft \
            --prerelease
