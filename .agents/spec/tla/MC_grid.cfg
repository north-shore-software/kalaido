INIT Init
NEXT Next

\* Next is UNCHANGED, so every state is its own only successor.
CHECK_DEADLOCK FALSE

CONSTANTS
    StartTimes <- mc_StartTimes
    Periods    <- mc_Periods
    Durations  <- mc_Durations
    MaxK       <- mc_MaxK
    MaxTime    <- mc_MaxTime

INVARIANT
    Inv_WindowsAreWellFormed
    Inv_TumblingPartitions
    Inv_OverlapIsBounded
    Inv_OverlapIsTight
    Inv_GapsAreExactlyTheStatedOnes
    Inv_OriginIsInAGapWhenGapped
    Inv_BoundariesDependOnlyOnK
    Inv_GridIsMonotonic
