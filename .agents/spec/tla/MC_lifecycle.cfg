INIT Init
NEXT Next

\* Exhausting MaxSnaps is an intended terminal condition, not a modelling error.
CHECK_DEADLOCK FALSE

CONSTANTS
    Projections    <- mc_Projections
    Reflections    <- mc_Reflections
    Windows        <- mc_Windows
    ApprovalPolicy <- mc_ApprovalPolicy
    MaxSnaps       <- mc_MaxSnaps
    MaxVers        <- mc_MaxVers

INVARIANT
    PhaseIsFaithful
    FreshnessIsNormalised
    TypeOK
    CollectionsAreDisjoint
    AutomaticQueueAlwaysEmpty
    RetiredNeverApproved
    ExactlyOneActive

PROPERTY
    ApprovalNeverClearsAnUnseenTrigger
    ObsoleteRetirementIsExact
    RefinementIsNotAStalenessTrigger
